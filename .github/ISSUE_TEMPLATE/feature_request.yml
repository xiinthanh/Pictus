name: Feature request
description: Suggest an improvement — Pictus aims to stay minimal, so explain the need
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you're trying to make or print and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds considered
